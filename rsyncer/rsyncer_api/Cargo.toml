[package]
name = "rsyncer_api"
version = "0.12.0"
edition = "2024"

[dependencies]
rsyncer_core = { path = "../rsyncer_core" }
dirs = "6.0.0"
dotenvy = "0.15.7"
env_logger = "0.11.8"
log = "0.4.33"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
tokio = { version = "1.48", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "net",
] }
tower = "0.5.3"
axum = "0.8.9"
axum-macros = "0.5.1"
async-trait = "0.1.89"
sqlx-cli = { version = "0.9.0", default-features = false, features = [
    "native-tls",
    "postgres",
] }
sqlx = { version = "0.9.0", features = ["postgres", "chrono"] }
chrono = "0.4.45"
