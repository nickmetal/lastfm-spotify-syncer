[package]
name = "rsyncer_cli"
version = "0.12.0"
edition = "2024"

[dependencies]
rsyncer_core = { path = "../rsyncer_core" }
async-trait = "0.1.89"
clap = { version = "4.5.54", features = ["derive"] }
dotenvy = "0.15.7"
env_logger = "0.11.8"
futures = "0.3.31"
futures-util = "0.3.31"
log = "0.4.33"
async-duckdb = "0.3.1"
tokio = { version = "1.48", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "net",
] }
thiserror = "2.0.17"
dirs = "6.0.0"
